<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1000"/>
      <stop offset="100%" style="stop-color:#0d0800"/>
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8a040"/>
      <stop offset="100%" style="stop-color:#bc6900"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#bc6900;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#bc6900;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- Brand glow behind JS -->
  <ellipse cx="512" cy="540" rx="340" ry="280" fill="url(#glow-grad)"/>

  <!-- Terminal chrome bar -->
  <rect x="96" y="168" width="832" height="56" rx="14" fill="#1a0f00" opacity="0.9"/>
  <circle cx="148" cy="196" r="13" fill="#ff5f57" opacity="0.9"/>
  <circle cx="196" cy="196" r="13" fill="#febc2e" opacity="0.9"/>
  <circle cx="244" cy="196" r="13" fill="#28c840" opacity="0.9"/>

  <!-- Filename in tab -->
  <text x="296" y="203" font-family="monospace" font-size="20" fill="#6b4a00">main.ts</text>

  <!-- Horizontal rule under chrome -->
  <line x1="96" y1="224" x2="928" y2="224" stroke="#3d2800" stroke-width="1.5"/>

  <!-- Prompt ">" -->
  <text
    x="110"
    y="780"
    font-family="'Courier New', Courier, monospace"
    font-size="160"
    font-weight="700"
    fill="#5a3800"
    opacity="0.5"
  >&#62;</text>

  <!-- Glow layer for symbol -->
  <text
    x="512"
    y="750"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="380"
    font-weight="900"
    fill="#bc6900"
    text-anchor="middle"
    filter="url(#glow)"
    opacity="0.5"
    letter-spacing="-8"
  >&lt;/&gt;</text>

  <!-- Main symbol — brand gradient -->
  <text
    x="512"
    y="750"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="380"
    font-weight="900"
    fill="url(#brand-grad)"
    text-anchor="middle"
    letter-spacing="-8"
  >&lt;/&gt;</text>

  <!-- Bottom underline accent -->
  <rect x="220" y="800" width="584" height="8" rx="4" fill="#bc6900" opacity="0.4"/>

  <!-- Cursor blink indicator -->
  <rect x="870" y="730" width="10" height="56" rx="3" fill="#e8a040" opacity="0.7"/>
</svg>
