<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.18)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="210" ry="210" fill="url(#bg)"/>

  <!-- Subtle top shine -->
  <rect width="1024" height="512" rx="210" ry="210" fill="url(#shine)"/>

  <!-- Terminal bar at top -->
  <rect x="112" y="200" width="800" height="260" rx="20" fill="rgba(0,0,0,0.25)"/>

  <!-- Traffic light dots -->
  <circle cx="168" cy="248" r="18" fill="#ff5f57"/>
  <circle cx="228" cy="248" r="18" fill="#febc2e"/>
  <circle cx="288" cy="248" r="18" fill="#28c840"/>

  <!-- Prompt ">" -->
  <text x="152" y="420" font-family="'Courier New', Courier, monospace" font-size="100" font-weight="700" fill="rgba(255,255,255,0.5)">&#62;</text>

  <!-- Blinking cursor bar -->
  <rect x="272" y="342" width="14" height="72" rx="4" fill="rgba(255,255,255,0.6)"/>

  <!-- Big "JS" text — the hero element -->
  <text
    x="512"
    y="790"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="310"
    font-weight="900"
    fill="white"
    text-anchor="middle"
    letter-spacing="-8"
  >JS</text>

  <!-- Underline accent -->
  <rect x="200" y="830" width="624" height="12" rx="6" fill="rgba(255,255,255,0.35)"/>
</svg>
