<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1117"/>
      <stop offset="100%" style="stop-color:#1a1d2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="256" x2="1024" y2="256"/>
    <line x1="0" y1="512" x2="1024" y2="512"/>
    <line x1="0" y1="768" x2="1024" y2="768"/>
    <line x1="256" y1="0" x2="256" y2="1024"/>
    <line x1="512" y1="0" x2="512" y2="1024"/>
    <line x1="768" y1="0" x2="768" y2="1024"/>
  </g>

  <!-- Background bracket hints -->
  <text x="60" y="660" font-family="monospace" font-size="440" font-weight="700" fill="#3b82f6" opacity="0.1">&lt;</text>
  <text x="520" y="660" font-family="monospace" font-size="440" font-weight="700" fill="#6366f1" opacity="0.1">&gt;</text>

  <!-- Main editor card -->
  <rect x="168" y="260" width="688" height="504" rx="44" ry="44" fill="#161929" opacity="0.96"/>
  <rect x="168" y="260" width="688" height="504" rx="44" ry="44" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.45"/>

  <!-- Title bar -->
  <rect x="168" y="260" width="688" height="60" rx="44" ry="44" fill="#1e2236"/>
  <rect x="168" y="290" width="688" height="30" fill="#1e2236"/>
  <line x1="168" y1="320" x2="856" y2="320" stroke="#2e3452" stroke-width="1.5"/>

  <!-- Traffic lights -->
  <circle cx="236" cy="290" r="13" fill="#ef4444"/>
  <circle cx="280" cy="290" r="13" fill="#f59e0b"/>
  <circle cx="324" cy="290" r="13" fill="#22c55e"/>

  <!-- File tab -->
  <rect x="368" y="270" width="110" height="50" rx="6" fill="#111320"/>
  <text x="384" y="301" font-family="monospace" font-size="16" fill="#94a3b8">index.js</text>

  <!-- Code lines -->
  <!-- const keyword -->
  <rect x="216" y="352" width="62" height="17" rx="4" fill="#818cf8" opacity="0.75"/>
  <!-- variable -->
  <rect x="290" y="352" width="90" height="17" rx="4" fill="#e2e8f0" opacity="0.45"/>
  <!-- = -->
  <rect x="392" y="352" width="18" height="17" rx="4" fill="#94a3b8" opacity="0.5"/>
  <!-- value -->
  <rect x="422" y="352" width="110" height="17" rx="4" fill="#fde68a" opacity="0.6"/>

  <!-- function call -->
  <rect x="216" y="390" width="108" height="17" rx="4" fill="#60a5fa" opacity="0.75"/>
  <rect x="336" y="390" width="72" height="17" rx="4" fill="#e2e8f0" opacity="0.3"/>
  <rect x="420" y="390" width="48" height="17" rx="4" fill="#4ade80" opacity="0.55"/>

  <!-- indent line 1 -->
  <rect x="256" y="428" width="200" height="17" rx="4" fill="#e2e8f0" opacity="0.18"/>

  <!-- indent line 2 -->
  <rect x="256" y="466" width="54" height="17" rx="4" fill="#818cf8" opacity="0.6"/>
  <rect x="322" y="466" width="148" height="17" rx="4" fill="#fde68a" opacity="0.4"/>

  <!-- cursor -->
  <rect x="216" y="504" width="4" height="24" rx="2" fill="#60a5fa" opacity="0.85"/>

  <!-- Output divider -->
  <line x1="216" y1="566" x2="808" y2="566" stroke="#2e3452" stroke-width="1.5"/>
  <text x="216" y="590" font-family="monospace" font-size="15" fill="#64748b">OUTPUT</text>

  <!-- Output lines -->
  <rect x="216" y="606" width="18" height="15" rx="3" fill="#4ade80" opacity="0.7"/>
  <rect x="246" y="606" width="180" height="15" rx="3" fill="#e2e8f0" opacity="0.35"/>

  <rect x="216" y="634" width="18" height="15" rx="3" fill="#4ade80" opacity="0.7"/>
  <rect x="246" y="634" width="120" height="15" rx="3" fill="#e2e8f0" opacity="0.25"/>

  <!-- JS badge pill - bottom right of card -->
  <rect x="688" y="706" width="120" height="44" rx="22" fill="url(#accent)"/>
  <text x="723" y="736" font-family="'Arial Black', monospace" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="2">JS</text>
</svg>
